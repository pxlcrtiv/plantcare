name: plantcare
description: PlantCare — AI-assisted plant identification and care tracking (Flutter).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1

  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  share_plus: ^13.3.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  permission_handler: ^11.1.0

  # Firebase dependencies
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  google_sign_in: ^6.1.5

  # Utilities
  crypto: ^3.0.3

  # State management
  provider: ^6.1.1

  # Notifications
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  firebase_ai: ^3.15.0
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
